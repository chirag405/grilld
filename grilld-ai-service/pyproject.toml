[project]
name = "grilld-ai-service"
version = "0.1.0"
description = "Grilld's AI service - Deep Agents + LangGraph. All agent/LLM logic lives here, never in the Spring Boot backend. See docs/decisions-and-technical-architecture.md §11."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-sdk>=0.3.15",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-anthropic",
    "langsmith>=0.8.18",
    "openevals>=0.1.0",
    "langchain-tavily>=0.1",
    "pydantic>=2.0",
    "psycopg[binary]",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "grilld_ai_service"
source-include = ["langgraph.json", ".env.example", "Makefile"]
