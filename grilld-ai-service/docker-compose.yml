volumes:
    langgraph-data:
        driver: local

services:
    langgraph-redis:
        image: redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5

    langgraph-postgres:
        image: pgvector/pgvector:pg16
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        command:
            - postgres
            - -c
            - shared_preload_libraries=vector
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 60s
            start_interval: 1s

    langgraph-api:
        ports:
            - "8123:8000"
        depends_on:
            langgraph-redis:
                condition: service_healthy
            langgraph-postgres:
                condition: service_healthy
        environment:
            REDIS_URI: redis://langgraph-redis:6379
            POSTGRES_URI: postgres://postgres:postgres@langgraph-postgres:5432/postgres?sslmode=disable
            # The shared grilld Postgres (Spring Boot's own docker-compose.yml, repo
            # root) - what get_graph()'s AsyncPostgresSaver actually checkpoints
            # graph state into. Not the same Postgres as POSTGRES_URI above, which
            # is only the LangGraph Platform server's own internal run/task state.
            # host.docker.internal reaches the host's exposed 5432 from inside this
            # container on Docker Desktop; real deployments override this with a
            # real DATABASE_URL (see docs/phases/phase-10/SETUP.md).
            DATABASE_URL: ${DATABASE_URL:-postgresql://grilld:grilld_dev_only@host.docker.internal:5432/grilld}
        healthcheck:
            test: python /api/healthcheck.py
            interval: 60s
            start_interval: 1s
            start_period: 10s
        env_file:
            - .env
        build:
            context: .
            dockerfile: Dockerfile.generated
