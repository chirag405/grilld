services:
  postgres:
    image: postgres:18-alpine
    container_name: grilld-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grilld
      POSTGRES_USER: grilld
      POSTGRES_PASSWORD: grilld_dev_only
    ports:
      - "5432:5432"
    volumes:
      - grilld-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grilld -d grilld"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grilld-postgres-data:
