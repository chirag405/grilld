# Local development profile - matches docker-compose.yml at the repo root.
# Activate with: SPRING_PROFILES_ACTIVE=local ./mvnw spring-boot:run
# (or your IDE's run-config equivalent)

DB_URL=jdbc:postgresql://localhost:5432/grilld
DB_USER=grilld
DB_PASSWORD=grilld_dev_only

management.endpoint.health.show-details=always

# Local Chrome profiles can accumulate large cookies across dev-server restarts,
# which trips Tomcat's default 8KB header limit with "Request header is too
# large" before the request ever reaches app code. Dev-only headroom fix.
server.max-http-request-header-size=1048576

# grilld-ai-service's local LangGraph dev server (uv run langgraph dev), default
# port 2024. Only read when the python-ai-service profile is also active -
# see HttpAiServiceClient. Same value as its own @Value default; documented
# here for visibility, not because the app requires this line to exist.
grilld.ai-service.base-url=http://localhost:2024
