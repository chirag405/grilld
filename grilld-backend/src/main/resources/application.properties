spring.application.name=grilld-backend

# Datasource - defaults match docker-compose.yml for local dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/grilld}
spring.datasource.username=${DB_USER:grilld}
spring.datasource.password=${DB_PASSWORD:grilld_dev_only}

# Flyway owns schema management - JPA must never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}
