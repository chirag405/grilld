spring.application.name=grilld-backend

# No dev defaults here on purpose - this file is the prod/default profile and should
# fail fast on missing config rather than silently fall back to a dev credential.
# For local development, run with SPRING_PROFILES_ACTIVE=local (see application-local.properties
# and docs/phases/phase-1/SETUP.md).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The Next.js frontend's own origin (Phase 9) - OAuth2LoginSuccessHandler redirects
# here after a real Google login, and SecurityConfig's CORS policy allows it to call
# the API directly. Not a secret, so it gets a working local default rather than
# failing fast like DB_URL/GOOGLE_CLIENT_ID - deployments must set FRONTEND_BASE_URL
# to their real domain (see docs/phases/phase-9/SETUP.md).
grilld.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Google OAuth2 login. "google" is a provider Spring Security already knows the
# endpoints for (authorization/token/user-info/jwk-set URIs) - only the app's own
# client-id/secret need to be supplied. See docs/phases/phase-1/SETUP.md for how
# to obtain these from Google Cloud Console.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT signing key (Phase 10 hardening). Empty by default -> JwtConfig falls back to an
# ephemeral in-memory key (fine for local/tests, invalidates all sessions on restart).
# Production deployments must set JWT_SIGNING_KEY_JWK to a persisted key - generate one
# with com.grilld.backend.tools.JwtKeyGenerator. See docs/phases/phase-10/SETUP.md.
grilld.jwt.signing-key-jwk=${JWT_SIGNING_KEY_JWK:}

# Per-user rate limiting on the endpoints that actually spend money (Phase 10
# hardening - credits are the only other cost gate, and they're checked only at
# generation time, not per-turn). See RateLimitConfig for which endpoints each
# tier covers. Disabled in tests via a surefire system property (pom.xml) since
# most tests hit the same endpoint many times per method on purpose.
grilld.ratelimit.enabled=${RATELIMIT_ENABLED:true}
grilld.ratelimit.interview.capacity=${RATELIMIT_INTERVIEW_CAPACITY:20}
grilld.ratelimit.interview.window-seconds=${RATELIMIT_INTERVIEW_WINDOW_SECONDS:60}
grilld.ratelimit.generation.capacity=${RATELIMIT_GENERATION_CAPACITY:5}
grilld.ratelimit.generation.window-seconds=${RATELIMIT_GENERATION_WINDOW_SECONDS:3600}
grilld.ratelimit.billing.capacity=${RATELIMIT_BILLING_CAPACITY:10}
grilld.ratelimit.billing.window-seconds=${RATELIMIT_BILLING_WINDOW_SECONDS:60}

# Package zip storage (Phase 10 hardening). "local" (default) needs nothing set -
# see LocalFilesystemPackageStorage. Production deployments running more than one
# instance, or across a redeploy, must switch to "s3" (S3PackageStorage) - works
# against real AWS S3 or any S3-compatible provider (R2/Wasabi/MinIO). See
# docs/phases/phase-10/SETUP.md.
grilld.packages.storage-provider=${PACKAGE_STORAGE_PROVIDER:local}
grilld.aws.region=${AWS_REGION:us-east-1}
grilld.aws.s3-bucket=${AWS_S3_BUCKET:}
grilld.aws.s3-endpoint=${AWS_S3_ENDPOINT:}
grilld.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
grilld.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Flyway owns schema management - JPA must never auto-generate DDL
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# Actuator: liveness/readiness for real deployment, not just a hand-rolled endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Lemon Squeezy - one-time-purchase credit top-ups (Phase 7, product-and-architecture.md
# §10 MVP scope item 7). See docs/phases/phase-7/SETUP.md for how to obtain each of
# these from the Lemon Squeezy dashboard. All four @Value defaults fall back to an
# empty string (see LemonSqueezySignatureVerifier/LemonSqueezyCheckoutService) rather
# than failing app startup - unconfigured billing shouldn't block booting the rest of
# the app locally; it only fails loudly the moment a webhook/checkout is actually used.
grilld.lemonsqueezy.webhook-secret=${LEMONSQUEEZY_WEBHOOK_SECRET:}
grilld.lemonsqueezy.store-subdomain=${LEMONSQUEEZY_STORE_SUBDOMAIN:}
grilld.lemonsqueezy.starter-variant-id=${LEMONSQUEEZY_STARTER_VARIANT_ID:}
grilld.lemonsqueezy.topup-variant-id=${LEMONSQUEEZY_TOPUP_VARIANT_ID:}
